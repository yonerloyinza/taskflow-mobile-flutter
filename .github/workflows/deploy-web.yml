name: Deploy Web (VPS)

on:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'web/**'
      - 'pubspec.yaml'
      - 'Dockerfile.web'
      - 'docker-compose.yml'
      - 'nginx.conf'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

concurrency:
  group: deploy-web
  cancel-in-progress: true

env:
  API_BASE_URL: ${{ vars.API_BASE_URL || 'https://taskflow-api-go.xprad.com' }}

jobs:
  deploy:
    name: Build & Deploy to VPS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check deploy secrets
        id: check
        run: |
          if [ -n "${{ secrets.VPS_SSH_KEY }}" ] && [ -n "${{ secrets.VPS_HOST }}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "VPS secrets not configured; skipping deploy."
          fi

      - uses: subosito/flutter-action@v2
        if: steps.check.outputs.ready == 'true'
        with:
          channel: stable
          cache: true

      - run: flutter pub get
        if: steps.check.outputs.ready == 'true'

      - name: Build Web (WASM)
        if: steps.check.outputs.ready == 'true'
        run: flutter build web --wasm --release --dart-define=API_BASE_URL=${{ env.API_BASE_URL }}

      - name: Deploy via SSH (git pull + docker compose)
        if: steps.check.outputs.ready == 'true'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/taskflow
            git pull --rebase origin main
            docker compose up -d --build --no-deps mobile-flutter-web